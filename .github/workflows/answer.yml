name: answer-quiz

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Also test the Claude fallback tiers on a practice question"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: answer-quiz
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fallback order inside solver.py: rules -> Claude Code (Pro subscription)
      # -> Messages API (API key) -> guess. Both secrets are optional.
      - name: Install fallback tools
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install anthropic; fi

      - name: Answer new rounds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py

      - name: Self-test Claude fallbacks
        if: inputs.selftest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py --selftest

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add answers
          if git diff --cached --quiet; then
            echo "No new answers"
            exit 0
          fi
          git commit -m "Answer new rounds"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1

      # Turns the run red (GitHub emails you) if a round has gone unanswered
      # for over an hour, or a question hit an unknown template and was guessed.
      - name: Alarm on overdue or guessed answers
        if: always()
        run: |
          git pull --quiet origin main || true
          python run.py --alarm
